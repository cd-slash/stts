name: STTS
options:
  bundleIdPrefix: com.stts
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  STTSCore:
    path: STTSCore
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  STTSiOS:
    type: application
    platform: iOS
    sources:
      - path: STTSiOS
    dependencies:
      - package: STTSCore
        product: STTSCore
      - target: STTSWatch
        embed: true
    info:
      path: STTSiOS/Info.plist
      properties:
        CFBundleDisplayName: STTS
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Microphone access for voice notes and meeting recording.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stts.mobile
        TARGETED_DEVICE_FAMILY: "1"
        # CarPlay "voice-based conversational app" entitlement (iOS 26.4+).
        # Apple grants this per app; an unapproved value breaks device signing,
        # so it stays unwired until the grant lands. When it does, set:
        #   CODE_SIGN_ENTITLEMENTS: STTSiOS/STTSiOS.entitlements
        # See docs/carplay.md.
        # CODE_SIGN_ENTITLEMENTS: ""
  STTSWatch:
    type: application
    platform: watchOS
    sources:
      - path: STTSWatch
    dependencies:
      - package: STTSCore
        product: STTSCore
    info:
      path: STTSWatch/Info.plist
      properties:
        CFBundleDisplayName: STTS
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.stts.mobile
        WKRunsIndependentlyOfCompanionApp: false
        NSMicrophoneUsageDescription: Microphone access for voice notes.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stts.mobile.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
schemes:
  STTSiOS:
    build:
      targets:
        STTSiOS: all
    run:
      config: Debug
  STTSWatch:
    build:
      targets:
        STTSWatch: all
    run:
      config: Debug
